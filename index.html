<script>
/* ========== الترجمة ========== */
const translations = {
  ar:{"نقطة البيع":"نقطة البيع","العقود":"العقود","المشاريع":"المشاريع","الحسابات":"الحسابات","التقارير":"التقارير","الإعدادات":"الإعدادات","شاشة البيع":"شاشة البيع","نقداً":"نقداً","بطاقة":"بطاقة","تحويل":"تحويل","إصدار الفاتورة":"إصدار الفاتورة","منتج جديد":"منتج جديد","طلب جديد":"طلب جديد","بائع جديد":"بائع جديد","عقد جديد":"عقد جديد","استخراج":"استخراج","حفظ":"حفظ","إغلاق":"إغلاق","المنتج":"المنتج","السعر":"السعر","الكمية":"الكمية","الإجمالي":"الإجمالي","ملخص الفاتورة":"ملخص الفاتورة","المجموع":"المجموع","الضريبة":"الضريبة","مبيعات":"مبيعات","منتجات":"منتجات","بائعين":"بائعين"},
  en:{"نقطة البيع":"POS","العقود":"Contracts","المشاريع":"Projects","الحسابات":"Accounts","التقارير":"Reports","الإعدادات":"Settings","شاشة البيع":"Sales Screen","نقداً":"Cash","بطاقة":"Card","تحويل":"Transfer","إصدار الفاتورة":"Issue Invoice","منتج جديد":"New Product","طلب جديد":"New Order","بائع جديد":"New Seller","عقد جديد":"New Contract","استخراج":"Export","حفظ":"Save","إغلاق":"Close","المنتج":"Product","السعر":"Price","الكمية":"Qty","الإجمالي":"Total","ملخص الفاتورة":"Invoice Summary","المجموع":"Subtotal","الضريبة":"Tax","مبيعات":"Sales","منتجات":"Products","بائعين":"Sellers"}
};
let currentLang = 'ar';
function switchLang(){
  currentLang = currentLang==='ar'?'en':'ar';
  document.documentElement.lang = currentLang;
  document.documentElement.dir   = currentLang==='ar'?'rtl':'ltr';
  document.querySelectorAll('.txt').forEach(el=>{
    const txt = el.textContent.trim();
    if(translations[currentLang][txt]) el.textContent = translations[currentLang][txt];
  });
  document.getElementById('langBtn').textContent = currentLang==='ar'?'EN':'AR';
}
document.getElementById('langBtn').onclick = switchLang;

/* ========== التنقل ========== */
window.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.sidebar .nav-link').forEach(link=>{
    link.addEventListener('click',e=>{
      e.preventDefault();
      const sec = link.getAttribute('data-sec');
      document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
      document.getElementById(sec).classList.add('active');
      document.querySelectorAll('.sidebar .nav-link').forEach(l=>l.classList.remove('active'));
      link.classList.add('active');
    });
  });
});

/* ========== POS ========== */
let cart = [];
const taxRate = ()=> +localStorage.getItem('taxRate') || 15;
function renderCart(){
  const body = document.getElementById('cartBody');
  body.innerHTML='';
  let sub=0;
  cart.forEach((it,idx)=>{
    sub += it.qty * it.price;
    body.insertAdjacentHTML('beforeend',`
      <tr>
        <td>${it.name}</td><td>${it.price}</td>
        <td><input type="number" min="1" value="${it.qty}" onchange="updateQty(${idx},this.value)" class="form-control form-control-sm w-75"></td>
        <td>${(it.qty*it.price).toFixed(2)}</td>
        <td><button class="btn btn-sm btn-danger" onclick="removeItem(${idx})"><i class="bi bi-trash"></i></button></td>
      </tr>`);
  });
  const tax = sub * taxRate()/100;
  document.getElementById('total').textContent = sub.toFixed(2);
  document.getElementById('tax').textContent   = tax.toFixed(2);
  document.getElementById('grand').textContent = (sub+tax).toFixed(2);
}
window.addProduct = function(){
  const val = document.getElementById('barcodeInput').value.trim();
  if(!val) return toast('أدخل اسم أو باركود المنتج');
  const products = JSON.parse(localStorage.getItem('products')||'[]');
  const found = products.find(p=>p.barcode===val||p.name.includes(val));
  if(!found) return toast('المنتج غير موجود');
  const exist = cart.find(c=>c.id===found.id);
  exist? exist.qty++ : cart.push({...found,qty:1});
  renderCart();
  document.getElementById('barcodeInput').value='';
}
window.updateQty = function(idx,q){cart[idx].qty=+q; renderCart();}
window.removeItem = function(idx){cart.splice(idx,1); renderCart();}
window.checkout = function(){
  if(!cart.length) return toast('السلة فارغة');
  const inv = {id:Date.now(), items:[...cart], total:document.getElementById('grand').textContent, date:new Date(), payMethod:document.getElementById('payMethod').value};
  const sales = JSON.parse(localStorage.getItem('sales')||'[]');
  sales.push(inv);
  localStorage.setItem('sales',JSON.stringify(sales));
  toast('تم إصدار الفاتورة وتحويلها للحسابات');
  cart=[]; renderCart();
}

/* ========== Toast ========== */
function toast(msg){
  const t=document.createElement('div');
  t.className='position-fixed top-0 start-50 translate-middle-x p-3 bg-dark text-white rounded mt-3'; t.style.zIndex=9999;
  t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}

/* ========== Settings ========== */
window.saveSettings = function(){
  localStorage.setItem('taxRate',document.getElementById('taxRate').value);
  localStorage.setItem('currency',document.getElementById('currency').value);
  toast('تم الحفظ');
}

/* ========== Demo Data ========== */
function loadDemo(){
  if(!localStorage.getItem('products')){
    localStorage.setItem('products',JSON.stringify([
      {id:1,name:'منتج تجريبي أ', barcode:'111', price:25, stock:100, active:true},
      {id:2,name:'منتج تجريبي ب', barcode:'222', price:40, stock:50, active:true}
    ]));
  }
  if(!localStorage.getItem('sellers')){
    localStorage.setItem('sellers',JSON.stringify([
      {id:1,name:'أحمد', email:'ahmed@demo.com', phone:'0500000001'},
      {id:2,name:'فاطمة', email:'fatima@demo.com', phone:'0500000002'}
    ]));
  }
}
loadDemo();
</script>
